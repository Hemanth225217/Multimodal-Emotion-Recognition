name: CI

on:
  push:
  pull_request:

jobs:
  results-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check recorded results and README numbers
        run: python -m unittest discover -s tests -v
